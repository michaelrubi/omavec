[workspace]
resolver = "3"
members = ["crates/omavec-geom", "crates/omavec-engine", "crates/omavec-render", "crates/omavec-fig", "crates/omavec"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
lto = "thin"
codegen-units = 4

# Curve maths and rendering are too slow unoptimised to test with real
# documents, so optimise dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
