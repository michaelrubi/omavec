[package]
name = "omavec-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Omavec's document: node tree, layout, text, components, undo and file formats"

[dependencies]
omavec-geom = { version = "0.0.1", path = "../omavec-geom" }
peniko = "0.6.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
# `float_roundtrip`: a number read back is the number that was written, so
# opening a file and saving it changes nothing.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.20"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
proptest = "1.11.0"
