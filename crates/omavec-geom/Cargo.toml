[package]
name = "omavec-geom"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Omavec's curve maths: vector networks, booleans, offsets, stroke expansion and warps"

[dependencies]
kurbo = { version = "0.13.1", features = ["serde"] }
# Booleans, Shape Builder regions, offset, outline stroke and simplify. Pinned
# to a commit and bumped on purpose; see docs/ROADMAP.md, "Borrowing from
# VectorCraft".
vectorcraft-geom = { git = "https://github.com/storytold/vectorcraft", rev = "4cf912fa947f2c2ce5415f2eb704c39b8e31e9dd" }
vectorcraft-pathops = { git = "https://github.com/storytold/vectorcraft", rev = "4cf912fa947f2c2ce5415f2eb704c39b8e31e9dd" }

[dev-dependencies]
proptest = "1.11.0"
