[package]
name = "omavec-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Omavec's renderer: display list to pixels with vello_cpu"

[dependencies]
omavec-engine = { version = "0.0.1", path = "../omavec-engine" }
kurbo = "0.13.1"
peniko = "0.6.1"
vello_cpu = { version = "0.3.0", features = ["multithreading"] }

[dev-dependencies]
# examples/text.rs only. skrifa is the version vello_cpu draws glyphs with.
fontique = "0.12.0"
parley = "0.12.0"
skrifa = "0.44.0"
resvg = { version = "0.48.1", default-features = false }
